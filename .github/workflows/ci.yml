name: OULAD CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Lint with ruff
        run: ruff check .
      - name: Run synthetic DuckDB & model tests
        env:
          PYTHONPATH: src
        run: pytest -q
